version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/api/src:/app/src:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - api
    restart: unless-stopped

  # Optional: Redis for caching quotes
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
